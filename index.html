<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Hogar — Tareas Compartidas</title>
  <meta name="description" content="Aplicación de gestión y reparto equitativo de tareas del hogar para 2 personas" />
  <meta name="theme-color" content="#2563eb" />
  
  <!-- PWA Manifest & Icons -->
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏠</text></svg>" />

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <div class="app-container">
    
    <!-- SIDEBAR (Desktop) -->
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-icon">🏠</span>
        <div class="brand-info">
          <h1 id="house-brand-title">Nuestra Casa</h1>
          <p>Tareas compartidas</p>
        </div>
      </div>

      <nav class="nav-links">
        <button class="nav-item active" data-nav-target="inicio">
          <span class="icon">🏠</span>
          <span>Inicio</span>
        </button>
        <button class="nav-item" data-nav-target="semana">
          <span class="icon">📅</span>
          <span>Semana</span>
        </button>
        <button class="nav-item" data-nav-target="tareas">
          <span class="icon">🔄</span>
          <span>Recurrentes</span>
        </button>
        <button class="nav-item" data-nav-target="historico">
          <span class="icon">🗂️</span>
          <span>Histórico</span>
        </button>
        <button class="nav-item" data-nav-target="estadisticas">
          <span class="icon">📊</span>
          <span>Estadísticas</span>
        </button>
        <button class="nav-item" data-nav-target="ajustes">
          <span class="icon">⚙️</span>
          <span>Ajustes</span>
        </button>
      </nav>

      <div class="sidebar-footer">
        <button class="btn-primary btn-open-add-task" style="width: 100%;">
          ＋ Nueva Tarea
        </button>
      </div>
    </aside>

    <!-- MAIN WRAPPER -->
    <div class="main-wrapper">
      
      <!-- TOP HEADER -->
      <header class="app-header">
        <div class="header-user-status">
          <span style="font-weight: 750; font-size: 1.1rem; color: var(--text-main);">🏠 Hogar</span>
        </div>

        <div class="header-actions">
          <button class="icon-btn" id="btn-toggle-theme" title="Cambiar tema">
            🌓
          </button>
          <button class="btn-primary btn-open-add-task" style="padding: 8px 16px; font-size: 0.9rem;">
            ＋ Añadir
          </button>
        </div>
      </header>

      <!-- VIEWS (SPA Container) -->
      <main class="main-content">
        <!-- 1. INICIO / DASHBOARD -->
        <section id="view-inicio" class="content-view active"></section>

        <!-- 2. SEMANA -->
        <section id="view-semana" class="content-view"></section>

        <!-- 3. TAREAS RECURRENTES / PLANTILLAS -->
        <section id="view-tareas" class="content-view"></section>

        <!-- 4. HISTÓRICO -->
        <section id="view-historico" class="content-view"></section>

        <!-- 5. ESTADÍSTICAS -->
        <section id="view-estadisticas" class="content-view"></section>

        <!-- 6. AJUSTES -->
        <section id="view-ajustes" class="content-view"></section>
      </main>

    </div>

    <!-- BOTTOM NAVIGATION (Mobile) -->
    <nav class="bottom-nav">
      <button class="bottom-nav-btn active" data-nav-target="inicio">
        <span class="nav-icon">🏠</span>
        <span>Inicio</span>
      </button>
      <button class="bottom-nav-btn" data-nav-target="semana">
        <span class="nav-icon">📅</span>
        <span>Semana</span>
      </button>
      <button class="bottom-nav-btn add-btn" data-nav-target="add-task" title="Añadir tarea">
        <span class="nav-icon">＋</span>
        <span>Añadir</span>
      </button>
      <button class="bottom-nav-btn" data-nav-target="estadisticas">
        <span class="nav-icon">📊</span>
        <span>Stats</span>
      </button>
      <button class="bottom-nav-btn" data-nav-target="ajustes">
        <span class="nav-icon">⚙️</span>
        <span>Ajustes</span>
      </button>
    </nav>

  </div>

  <!-- MODAL: CREAR TAREA -->
  <div class="modal-backdrop" id="modal-add-task">
    <div class="modal-dialog">
      <div class="modal-header">
        <h3 class="modal-title">Nueva Tarea</h3>
        <button class="modal-close" title="Cerrar">&times;</button>
      </div>
      
      <form id="form-add-task">
        <div class="modal-body">
          
          <div class="form-group">
            <label class="form-label">Nombre de la tarea</label>
            <input type="text" class="form-input" id="add-task-name" placeholder="Ej. Limpiar el baño, Comprar fruta..." required />
          </div>

          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Tipo</label>
              <select class="form-select" id="add-task-type">
                <option value="single">📌 Única</option>
                <option value="recurrent">🔄 Recurrente</option>
                <option value="chapuza">🔧 Chapuza</option>
              </select>
            </div>

            <div class="form-group">
              <label class="form-label">Categoría</label>
              <select class="form-select" id="add-task-category">
                <option value="limpieza">🧹 Limpieza</option>
                <option value="cocina">🍽️ Cocina</option>
                <option value="lavadora">🧺 Lavadora</option>
                <option value="perro">🐶 Perro / Mascota</option>
                <option value="chapuzas">🔧 Chapuzas</option>
                <option value="compras">🛒 Compras</option>
                <option value="hogar" selected>🪴 Hogar</option>
              </select>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Responsable</label>
              <select class="form-select" id="add-task-assignee">
                <option value="user-1" id="opt-assignee-u1">Persona 1</option>
                <option value="user-2" id="opt-assignee-u2">Persona 2</option>
                <option value="alternate_weekly">🔄 Alternar (por semana)</option>
                <option value="alternate_turn">🔄 Alternar (por turnos)</option>
              </select>
            </div>

            <div class="form-group">
              <label class="form-label">Fecha programada</label>
              <input type="date" class="form-input" id="add-task-date" required />
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Peso / Esfuerzo</label>
              <select class="form-select" id="add-task-weight">
                <option value="1">1 pt (Ligera - ej. platos, arenero)</option>
                <option value="2" selected>2 pts (Media - ej. aspirar, cena)</option>
                <option value="3">3 pts (Pesada - ej. perro, baño)</option>
                <option value="4">4 pts (Muy pesada - fondo)</option>
              </select>
            </div>

            <div class="form-group">
              <label class="form-label">Duración estimada</label>
              <select class="form-select" id="add-task-duration">
                <option value="10">10 min</option>
                <option value="15" selected>15 min</option>
                <option value="30">30 min</option>
                <option value="45">45 min</option>
                <option value="60">1 hora</option>
                <option value="120">2 horas</option>
              </select>
            </div>
          </div>

          <!-- Opciones de recurrencia si está activada -->
          <div class="form-group" style="margin-top: 10px;">
            <label style="display: flex; align-items: center; gap: 8px; font-size: 0.9rem; font-weight: 600; cursor: pointer;">
              <input type="checkbox" id="add-task-is-recurring" style="width: 18px; height: 18px;" />
              <span>Guardar como tarea recurrente automática</span>
            </label>
          </div>

          <div class="form-group" id="group-recurrence-options" style="display: none; background: var(--bg-surface-subtle); padding: 12px; border-radius: var(--radius-md);">
            <label class="form-label">Frecuencia de repetición</label>
            <select class="form-select" id="add-task-frequency">
              <option value="daily">Diaria</option>
              <option value="every_2_days">Cada 2 días</option>
              <option value="weekly">Semanal</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label">Notas o detalles (opcional)</label>
            <textarea class="form-textarea" id="add-task-notes" rows="2" placeholder="Instrucciones, recordatorios, marcas..."></textarea>
          </div>

        </div>

        <div class="modal-footer">
          <button type="button" class="btn-secondary modal-close">Cancelar</button>
          <button type="submit" class="btn-primary">Crear Tarea</button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL: ACCIONES RÁPIDAS DE TAREA -->
  <div class="modal-backdrop" id="modal-quick-actions">
    <div class="modal-dialog" style="max-width: 440px;">
      <div class="modal-header">
        <h3 class="modal-title">Opciones de Tarea</h3>
        <button class="modal-close">&times;</button>
      </div>
      <div class="modal-body" id="quick-actions-body">
        <!-- Rendered dynamically -->
      </div>
    </div>
  </div>

  <!-- MODAL: INSPECCIONAR SEMANA PASADA -->
  <div class="modal-backdrop" id="modal-inspect-week">
    <div class="modal-dialog">
      <div class="modal-header">
        <h3 class="modal-title" id="inspect-week-title">Detalle de Semana</h3>
        <button class="modal-close">&times;</button>
      </div>
      <div class="modal-body" id="inspect-week-body">
        <!-- Rendered dynamically -->
      </div>
      <div class="modal-footer">
        <button class="btn-secondary modal-close">Cerrar</button>
      </div>
    </div>
  </div>

  <!-- TOAST CONTAINER -->
  <div class="toast-container" id="toast-container"></div>

  <!-- SCRIPTS -->
  <script src="js/models.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
  <script>
    // Recurrence checkbox toggle in add task modal
    document.getElementById('add-task-is-recurring')?.addEventListener('change', function() {
      const opts = document.getElementById('group-recurrence-options');
      if (opts) opts.style.display = this.checked ? 'block' : 'none';
      if (this.checked) {
        document.getElementById('add-task-type').value = 'recurrent';
      }
    });

    document.getElementById('add-task-type')?.addEventListener('change', function() {
      const isRecur = this.value === 'recurrent';
      const chk = document.getElementById('add-task-is-recurring');
      if (chk) chk.checked = isRecur;
      const opts = document.getElementById('group-recurrence-options');
      if (opts) opts.style.display = isRecur ? 'block' : 'none';
    });
  </script>
</body>
</html>
